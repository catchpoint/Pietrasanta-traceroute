name: Pietrasanta-traceroute
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: default
priority: optional
description: Pietrasanta traceroute
homepage: https://www.catchpoint.com
license: GPL-2.0-or-later

depends: []

overrides:
  rpm:
    depends:
      - libssl.so.3()(64bit)
      - libcrypto.so.3()(64bit)

  deb:
    depends:
      - libssl3

contents:
  - src: ./binaries/${PLATFORM_DIR}/traceroute # glibc compatibility allows us to use the same binary for many linux distros...
    dst: /usr/local/bin/pietrasanta-traceroute
    file_info:
      mode: 0755
    expand: true
  - src: ./traceroute/traceroute.8
    dst: /usr/local/share/man/man8/pietrasanta-traceroute.8
    file_info:
      mode: 0644
    
scripts:
  postinstall: build/post.sh
